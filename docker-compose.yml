services:
  postgres:
    image: postgres:16-alpine
    container_name: tiny-museum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiny
      POSTGRES_PASSWORD: tiny
      POSTGRES_DB: tiny_museum
    ports:
      - "5433:5432"
    volumes:
      - tiny-museum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiny -d tiny_museum"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  tiny-museum-pgdata:
