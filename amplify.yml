# Every cd runs in a subshell: Amplify reuses one shell across phases, so a bare cd leaks.
version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            - (cd ../.. && npm ci)
            # Set SKIP_BACKEND_DEPLOY=true on the branch to ship the web app without the worker.
            - |
              (
                if [ "$SKIP_BACKEND_DEPLOY" = "true" ]; then
                  echo "SKIP_BACKEND_DEPLOY=true - not deploying amplify/backend.ts."
                  exit 0
                fi
                # npm ci rejects the lockfile @aws-amplify/data-construct's bundled deps produce.
                (cd ../../amplify && npm install --no-audit --no-fund) || exit 1
                (cd ../.. && npm run layer:sharp) || exit 1
                # ampx refuses to start without npm_config_user_agent, which only npm run sets.
                (cd ../.. && npm run deploy:backend -- --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID") || exit 1
              )
    frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - (cd ../.. && npm ci)
        build:
          commands:
            - (cd ../.. && npm run db:schema)
            # SSR compute does not receive build-time variables; Next.js loads .env.production at runtime.
            - (cd ../.. && env | grep -E '^(DATABASE_URL|SESSION_SECRET|MEDIA_BASE_URL|MEDIA_ORIGIN_URL|PUBLIC_BASE_URL|STORAGE_DRIVER|S3_BUCKET|AWS_REGION|MAIL_TRANSPORT|EPOCH_INTERVAL_MINUTES|HALL_OWNER_EMAIL)=' > apps/web/.env.production && npm run build --workspace @tiny/web)
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
