# Amplify Hosting build for an npm-workspaces monorepo.
#
# appRoot is apps/web, but the install has to happen at the repo root or the
# workspace links (@tiny/core) will not exist — hence the cd in every phase.
#
# Each cd is wrapped in a subshell on purpose. Amplify runs every phase in one
# long-lived shell, so a bare `cd ../..` leaks into the next phase and the
# second one lands two levels above the repo. Subshells keep every command
# starting from appRoot.
version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            # The backend deploys the scheduled worker (amplify/backend.ts).
            # It runs before the frontend, so it does its own install.
            - (cd ../.. && npm ci)
            # amplify/ is not a workspace member and installs on its own. It
            # must be `npm install`, not `npm ci`: @aws-amplify/data-construct
            # ships bundled dependencies that npm cannot write into a lockfile
            # it will later accept. See amplify/README.md.
            - (cd ../../amplify && npm install --no-audit --no-fund)
            # sharp ships a native binary and is supplied to the function by a
            # layer, not the bundle. Built for the Lambda platform explicitly,
            # so this does not silently depend on the build host matching.
            - (cd ../.. && npm run layer:sharp)
            # ampx lives in amplify/node_modules, but runs from the repo root
            # so that CDK's `npx --no-install esbuild` bundling resolves.
            - (cd ../.. && ./amplify/node_modules/.bin/ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID")
    frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - (cd ../.. && npm ci)
        build:
          commands:
            - (cd ../.. && npm run build --workspace @tiny/web)
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
