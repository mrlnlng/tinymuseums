# Amplify Hosting build for an npm-workspaces monorepo.
#
# appRoot is apps/web, but the install has to happen at the repo root or the
# workspace links (@tiny/core) will not exist — hence the cd in every phase.
#
# Each cd is wrapped in a subshell on purpose. Amplify runs every phase in one
# long-lived shell, so a bare `cd ../..` leaks into the next phase and the
# second one lands two levels above the repo. Subshells keep every command
# starting from appRoot.
version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            # The backend deploys the scheduled worker (amplify/backend.ts).
            # It runs before the frontend, so it does its own install.
            - (cd ../.. && npm ci)
            # The backend deploy needs a service role with
            # AmplifyBackendDeployFullAccess and a bootstrapped region. Until
            # both are in place it fails, and a failed backend phase blocks the
            # frontend with it — so there is an explicit escape hatch. Set the
            # branch variable SKIP_BACKEND_DEPLOY=true to ship the web app on
            # its own; unset it to resume deploying the worker.
            - |
              (
                if [ "$SKIP_BACKEND_DEPLOY" = "true" ]; then
                  echo "SKIP_BACKEND_DEPLOY=true - not deploying amplify/backend.ts."
                  exit 0
                fi
                # amplify/ is not a workspace member and installs on its own.
                # It must be `npm install`, not `npm ci`:
                # @aws-amplify/data-construct ships bundled dependencies that
                # npm cannot write into a lockfile it will later accept.
                (cd ../../amplify && npm install --no-audit --no-fund) || exit 1
                # sharp ships a native binary and is supplied to the function
                # by a layer, not the bundle. Built for the Lambda platform
                # explicitly, so this does not silently depend on the build
                # host matching.
                (cd ../.. && npm run layer:sharp) || exit 1
                # Through `npm run`, not the binary directly: ampx reads
                # npm_config_user_agent and refuses to start without it, and
                # only npm sets that. It runs from the repo root because ampx
                # resolves amplify/backend.ts relative to the cwd, and CDK
                # bundles by shelling out to esbuild from it as well.
                (cd ../.. && npm run deploy:backend -- --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID") || exit 1
              )
    frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - (cd ../.. && npm ci)
        build:
          commands:
            - (cd ../.. && npm run build --workspace @tiny/web)
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
